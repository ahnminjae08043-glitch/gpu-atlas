<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gpu-atlas</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --line: #2a313a;
    --fg: #e6edf3; --dim: #8b949e;
    --ok: #3fb950; --warn: #d29922; --bad: #f85149; --accent: #58a6ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 24px 80px;
    background: var(--bg); color: var(--fg);
    font: 14px/1.6 ui-monospace, "Cascadia Code", Consolas, monospace;
  }
  main { max-width: 1000px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -0.02em; }
  .sub { color: var(--dim); margin: 0 0 24px; font-size: 13px; }
  button {
    background: var(--accent); color: #0d1117; border: 0; border-radius: 6px;
    padding: 10px 18px; font: inherit; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  button.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  #progress { margin: 20px 0; display: none; }
  #progress.on { display: block; }
  .bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.2s; }
  .stage { color: var(--dim); font-size: 12px; margin-top: 6px; }
  section { margin-top: 28px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em;
       color: var(--dim); margin: 0 0 10px; font-weight: 600; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th { text-align: left; color: var(--dim); font-weight: 500; padding: 4px 8px; border-bottom: 1px solid var(--line); }
  td { padding: 3px 8px; border-bottom: 1px solid #1e242c; }
  tr:last-child td { border-bottom: 0; }
  .y { color: var(--ok); }
  .n { color: #4a525c; }
  .x { color: var(--bad); }
  .kv { display: grid; grid-template-columns: 180px 1fr; gap: 2px 12px; font-size: 12.5px; }
  .kv dt { color: var(--dim); }
  .kv dd { margin: 0; overflow-wrap: anywhere; }
  .issue { padding: 8px 10px; border-left: 3px solid; margin-bottom: 6px;
           background: #1a1f27; border-radius: 0 4px 4px 0; font-size: 12.5px; }
  .issue.breaking { border-color: var(--bad); }
  .issue.degraded { border-color: var(--warn); }
  .issue.note { border-color: var(--dim); }
  .issue b { color: var(--fg); }
  .issue span { color: var(--dim); }
  .empty { color: var(--dim); font-size: 12.5px; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .shaky { color: var(--warn); }
  pre { background: #0a0d11; border: 1px solid var(--line); border-radius: 6px;
        padding: 12px; overflow: auto; max-height: 400px; font-size: 11.5px; color: var(--dim); }
</style>
</head>
<body>
<main>
  <h1>gpu-atlas</h1>
  <p class="sub">이 브라우저의 WebGPU가 실제로 무엇을 할 수 있는지 측정한다. 선언된 limits가 아니라 직접 만들어보고 그려본 결과다.</p>

  <div class="row">
    <button id="run">측정 시작</button>
    <button id="quick" class="ghost">벤치 없이 빠르게</button>
    <button id="copy" class="ghost" disabled>프로파일 복사</button>
    <button id="save" class="ghost" disabled>JSON 저장</button>
  </div>

  <div id="progress">
    <div class="bar"><i></i></div>
    <div class="stage"></div>
  </div>

  <div id="out"></div>
</main>
<script type="module" src="./main.ts"></script>
</body>
</html>
