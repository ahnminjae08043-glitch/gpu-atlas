name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      # The probe itself needs a GPU, but comparison and quantization detection
      # are pure functions and run anywhere.
      - name: Test
        run: npm test

      - name: Build library
        run: npx vite build
